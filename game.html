<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu - Go</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Plotly pour le graphique des prisonniers -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div class="page-container mt-4">
        <img src="images/goban.png" alt="Goban" class="corner-goban">
        <h1 class="page-title">Jeu de Go</h1>

        <!-- Configuration -->
        <div class="info-box mb-4">
            <h4>Configuration de la partie</h4>

            <div class="row">

                <div class="col-md-3">
                    <label>Taille du goban</label>
                    <select class="form-select" id="tailleGoban">
                        <option value="9">9 x 9</option>
                        <option value="13">13 x 13</option>
                        <option value="19">19 x 19</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label>Handicap</label>
                    <select class="form-select" id="handicap">
                        <option>0</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label>Komi</label>
                    <input type="number" class="form-control" id="komi" value="7.5" step="0.5">
                </div>

                <div class="col-md-3">
                    <label>Mode</label>
                    <div>
                        <input type="radio" name="mode" value="2joueurs" checked> 2 joueurs
                    </div>
                    <div>
                        <input type="radio" name="mode" value="ordinateur"> Contre ordinateur
                    </div>
                    <div id="choixIA" class="choix-ia">
                        <select class="form-select" id="niveauIA">
                            <option value="aleatoire">IA aléatoire</option>
                            <option value="intelligent">IA intelligente</option>
                        </select>
                    </div>
                </div>

            </div>

            <div class="mt-3">
                <button class="btn btn-success" id="btnNouvelle">Nouvelle partie</button>
                <button class="btn btn-secondary" id="btnPasser">Passer</button>
                <button class="btn btn-danger" id="btnFin">Fin de partie</button>
            </div>

        </div>

        <!-- Zone plateau -->
        <div class="row">

            <div class="col-md-8">
                <div class="info-box text-center">
                    <canvas id="goban"></canvas>
                </div>
                <!-- Graphique des prisonniers -->
                <div class="info-box mt-3">
                    <h5>Prisonniers au cours de la partie</h5>
                    <div id="graphique"></div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="info-box mb-3">
                    <h5>Informations</h5>
                    <p>Joueur actuel : <span id="joueurActuel">Noir</span></p>
                    <p>Prisonniers Noir : <span id="prisonniersNoir">0</span></p>
                    <p>Prisonniers Blanc : <span id="prisonniersBlanc">0</span></p>
                    <p>⏱ Temps Noir : <span id="tempsNoir">10:00</span></p>
                    <p>⏱ Temps Blanc : <span id="tempsBlanc">10:00</span></p>
                </div>

                <div class="info-box">
                    <h5>Historique des coups</h5>
                    <ul id="historique">
                        <li>Aucun coup pour le moment</li>
                    </ul>
                </div>
            </div>

        </div>

        <div class="btn-row mt-4">
            <a href="index.html" class="go-btn informations-btn">Retour accueil</a>
        </div>

    </div>
    <script src="game.js"></script>
</body>
</html>
